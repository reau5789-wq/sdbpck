# 노회 홈페이지 게시판(노회공지·소속교회 동정)을 30분마다 읽어 앱에 연동합니다.
name: 홈페이지 공지 연동

on:
  schedule:
    - cron: '7,37 * * * *'     # 매시 7분·37분 (한국 시간 기준도 동일)
  workflow_dispatch:            # Actions 화면에서 [Run workflow]로 바로 실행

permissions:
  contents: write

concurrency:
  group: sync-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 홈페이지 게시판 읽기
        run: node tools/sync-board.mjs
      - name: 바뀐 글이 있으면 저장
        run: |
          if [ -n "$(git status --porcelain data/board.json)" ]; then
            git config user.name "sdbpck-sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/board.json
            git commit -m "홈페이지 공지 연동 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "바뀐 글 없음"
          fi
