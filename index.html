<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<meta name="description" content="서울동북노회 회원교회 목사님·장로님을 위한 노회 업무 앱 — 공지, 일정, 증명서·공문서 신청">
<title>서울동북노회 모바일</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>

<script src="js/config.js"></script>
<script src="js/data-sdbpck.js"></script>
<!-- 실제 운영(mode:'live')일 때만 Firebase를 불러옵니다 -->
<script>
  if (APP_CONFIG.mode === 'live' && APP_CONFIG.firebase.apiKey) {
    ['firebase-app-compat','firebase-auth-compat','firebase-firestore-compat'].forEach(n =>
      document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/' + n + '.js"><\/script>'));
  }
</script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
